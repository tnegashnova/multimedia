<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Explore Multimedia</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* Global Styles */
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
            line-height: 1.6;
        }
        header {
            background: #007BFF;
            color: white;
            padding: 20px 10px;
            text-align: center;
        }
        header h1 {
            margin: 0;
        }
        nav {
            text-align: center;
            background: #0056b3;
            padding: 10px 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        nav a {
            text-decoration: none;
            color: white;
            margin: 0 15px;
            font-weight: bold;
            font-size: 1rem;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background 0.3s ease;
        }
        nav a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .content {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        h1 {
            font-size: 2.2rem;
        font-weight: 700;
        margin-bottom: 10px;
        color: #0056b3;
        letter-spacing: 1px;
        text-align: center;
        font-family: 'Roboto', sans-serif;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .gallery img {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .gallery img:hover {
            transform: scale(1.05);
        }
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 10px 0;
            margin-top: 20px;
        }
        .hero {
        position: relative;
        background-image: url('161FBA29-A0CB-4618-9BFE-4C8E2D56FE14_1_102_o.jpeg');
        background-size: cover;
        background-position: center;
        height: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        text-align: center;
        }



    .hero h1 {
        font-size: 3rem;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.8);
        margin: 0;
        letter-spacing: 2px;
    }

    </style>
</head>
<body>
    <header class="hero">
        <div class="hero-overlay">
            <h1>Image Gallery</h1>
        </div>
    </header>
    
    <nav>
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="video.html">Videos</a>
        <a href="audio.html">Audio</a>
        <a href="contact.html">Contact</a>
    </nav>
    <div class="content">

        <div class="gallery">

            <img src="C9BD8AF2-B837-489A-A83B-041CD4BC95B7_1_105_c.jpeg" alt="Gallery Image 2">
            <img src="C3A94D42-CC33-435D-BD27-D4D911A5FF52_1_105_c.jpeg" alt="Gallery Image 3">
            <img src="6966AF8F-B619-406E-ACEF-1DAD1CC51DD0_1_102_o.jpeg" alt="Gallery Image 4">
            <img src="4415C64B-4117-4AF1-8017-5235A15FFBE8_1_105_c.jpeg" alt="Gallery Image 5">
            <img src="3FCFB56B-2540-4541-9CDD-222791D38C9F_1_102_o.jpeg" alt="Gallery Image 6">
        </div>
    </div>
    <footer>

    </footer>
