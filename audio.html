<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Multimedia</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* Global Styles */
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
            line-height: 1.6;
            background-color: #f9f9f9;
        }

        .hero-header {
            background: url('https://img.freepik.com/premium-vector/professional-british-woman-using-headphones-headset-wide-angle-view_1322553-103456.jpg?semt=ais_hybrid&w=740') no-repeat center center/cover;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            position: relative;
        }

        .hero-header::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .hero-header-content {
            position: relative;
            z-index: 2;
        }

        .hero-header-content h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin: 0;
        }

        nav {
            text-align: center;
            background: #0056b3;
            padding: 12px 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        nav a {
            text-decoration: none;
            color: white;
            margin: 0 18px;
            font-weight: bold;
            font-size: 1rem;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background 0.3s ease;
        }

        nav a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .section {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .section h2 {
            color: #007BFF;
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .audio {
            text-align: center;
        }

        .audio-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .audio audio {
            width: 100%;
            max-width: 400px;
            outline: none;
            border-radius: 6px;
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 15px 0;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <header class="hero-header">
        <div class="hero-header-content">
            <h1>Audio Center</h1>
        </div>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="video.html">Videos</a>
        <a href="audio.html">Audio</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- Removed: <div class="hero">Immerse Yourself in Multimedia</div> -->

    <div class="section audio" id="audio">
        <h2>Audio</h2>
        <div class="audio-wrapper">
            <audio controls>
                <source src="Tnegash-sebene.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>
    </div>

    <footer>
        &copy; 2025 Explore Multimedia. All rights reserved.
    </footer>
</body>
</html>
